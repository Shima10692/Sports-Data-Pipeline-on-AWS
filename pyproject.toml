[project]
name = "sports-data-pipeline"
version = "0.1.0"
description = "Practice data engineering pipeline for live and historical sports data on AWS."
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Repo-wide checks live in tests/; each ingestion component keeps its own tests/ folder.
testpaths = ["tests", "ingestion"]
# Each ingestion component has src/ (importable package) and tests/ (fakes in conftest.py).
pythonpath = ["ingestion/backfill/src", "ingestion/backfill/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
